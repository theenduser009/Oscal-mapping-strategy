name: Apply property name mapper support

on:
  push:
    branches: [simplify-metadata-boundary]
    paths:
      - '.github/workflows/apply-property-name-support.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: simplify-metadata-boundary
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply small generic PROPERTY_NAME capability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          cell3 = root / 'notebooks/cells/03_canonical_mapping_contract.py'
          replace_once(
              cell3,
              '    allowed = {"VALUE_SOURCE", "VALUE_REQUIRED"}\n',
              '    allowed = {"VALUE_SOURCE", "VALUE_REQUIRED"}\n'
              '    if operator in {"properties", "observations"} and row.get("PROPERTY_NAME") not in (None, ""):\n'
              '        allowed.add("PROPERTY_NAME")\n'
              '        property_name = _metadata_column_text(row, "PROPERTY_NAME", True)\n'
              '        if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", property_name):\n'
              '            raise ValueError("PROPERTY_NAME contains unsupported characters")\n'
              '        representation["property_name"] = property_name\n'
          )
          replace_once(
              cell3,
              '    columns = {"ALLOWED_VALUES", "VALUE_MAP", "OTHER_REMARKS_TEMPLATE", "ROLE_ID", "ROLE_TITLE",\n'
              '               "REFERENCE_TYPE", "LOOKUP_KEY", "DESCRIPTION_REQUIRED", "VALUE_SOURCE", "VALUE_REQUIRED"}\n',
              '    columns = {"ALLOWED_VALUES", "VALUE_MAP", "OTHER_REMARKS_TEMPLATE", "ROLE_ID", "ROLE_TITLE",\n'
              '               "REFERENCE_TYPE", "LOOKUP_KEY", "DESCRIPTION_REQUIRED", "VALUE_SOURCE", "VALUE_REQUIRED",\n'
              '               "PROPERTY_NAME"}\n'
          )

          cell4 = root / 'notebooks/cells/04_parsing_transform_payload_helpers.py'
          replace_once(
              cell4,
              '                prop = {"name": _metadata_text(_stable_property_name(field), "Property name"), "value": item}\n',
              '                property_name = _metadata_params(row).get("property_name") or _stable_property_name(field)\n'
              '                prop = {"name": _metadata_text(property_name, "Property name"), "value": item}\n'
          )

          mapping_doc = root / 'Mapping/MAPPING_COLUMNS.md'
          replace_once(
              mapping_doc,
              '| VALUE_REQUIRED | true requires a nonempty value before and after conversion. Blank/false preserves optional behavior; 0 and false are values, not missing data. |\n',
              '| VALUE_REQUIRED | true requires a nonempty value before and after conversion. Blank/false preserves optional behavior; 0 and false are values, not missing data. |\n'
              '| PROPERTY_NAME | Optional exact name for a properties/observations mapping. Blank preserves the existing source-field-slug behavior. |\n'
          )
          PY

          cat > tests/lean/test_property_name_override.py <<'PYTEST'
          """Optional explicit property-name support without changing legacy defaults."""
          import unittest

          import lean_support
          import test_metadata_driven_contract as base


          def active_namespace():
              # Load the maintained seven-cell sources so this test exercises
              # both the Cell 3 compiler and Cell 4 property emitter together.
              return lean_support.namespace(models=("SSP",))


          class PropertyNameOverrideTests(unittest.TestCase):
              def test_optional_override_compiles_and_emits_exact_name(self):
                  ns = active_namespace()
                  row = base.mapping(
                      "NEW_SCORE", base.OBSERVATION, "scalar-score",
                      PROPERTY_NAME="approved-score-label",
                  )
                  context = base.compile_context(ns, [row])
                  self.assertEqual("READY", context["routing_report"]["STATUS"])
                  self.assertEqual(
                      "approved-score-label",
                      context["mapping_rows"][0]["REPRESENTATION_PARAMS"]["property_name"],
                  )
                  nodes, _ = base.build(ns, context, [{
                      "SOURCE_RECORD_ID": "record-one",
                      "CURATED_JSON": {"NEW_SCORE": 7},
                  }])
                  self.assertEqual(
                      [{"name": "approved-score-label", "value": "7"}],
                      base.payloads(nodes, base.OBSERVATION)[0]["props"],
                  )

              def test_blank_override_keeps_existing_source_field_slug(self):
                  ns = active_namespace()
                  row = base.mapping(
                      "NEW_SCORE", base.OBSERVATION, "scalar-score", PROPERTY_NAME="",
                  )
                  context = base.compile_context(ns, [row])
                  nodes, _ = base.build(ns, context, [{
                      "SOURCE_RECORD_ID": "record-one",
                      "CURATED_JSON": {"NEW_SCORE": 3},
                  }])
                  self.assertEqual(
                      [{"name": "new-score", "value": "3"}],
                      base.payloads(nodes, base.OBSERVATION)[0]["props"],
                  )

              def test_override_is_rejected_for_non_property_operator(self):
                  ns = active_namespace()
                  context = base.compile_context(ns, [base.mapping(PROPERTY_NAME="not-allowed")])
                  self.assertEqual("BLOCKED", context["routing_report"]["STATUS"])
                  self.assertEqual([], context["mapping_rows"])

              def test_override_with_whitespace_is_rejected(self):
                  ns = active_namespace()
                  row = base.mapping(
                      "NEW_SCORE", base.OBSERVATION, "scalar-score", PROPERTY_NAME="bad name",
                  )
                  context = base.compile_context(ns, [row])
                  self.assertEqual("BLOCKED", context["routing_report"]["STATUS"])
                  self.assertEqual([], context["mapping_rows"])


          if __name__ == "__main__":
              unittest.main()
          PYTEST

          python tools/sync_notebook_cells.py
      - name: Install test dependencies
        run: python -m pip install 'snowflake-snowpark-python[localtest]==1.55.0' pandas==2.3.3
      - name: Run property-name tests
        run: python -m unittest discover -s tests/lean -p 'test_property_name_override.py' -v
      - name: Run relevant mapper regression tests
        env:
          REQUIRE_SNOWPARK_TESTS: '1'
        shell: bash
        run: |
          for pattern in \
            test_acceptance.py \
            test_ar30_extension.py \
            test_ar_null_observations.py \
            test_assessment_plan.py \
            test_compiler.py \
            test_graph_gaps.py \
            test_metadata_gaps.py \
            test_notebook_end_to_end.py \
            test_poam_references.py \
            test_transforms.py
          do
            python -m unittest discover -s tests/lean -p "$pattern" -v
          done
      - name: Verify generated notebook is synchronized
        run: python tools/sync_notebook_cells.py --check
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested mapper change
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No mapper changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/cells/03_canonical_mapping_contract.py \
                  notebooks/cells/04_parsing_transform_payload_helpers.py \
                  notebooks/cells_v2/03_canonical_mapping_contract.py \
                  notebooks/cells_v2/04_parsing_transform_payload_helpers.py \
                  notebooks/NB_ARCHER_OSCAL_MAPPER_V1.py \
                  Mapping/MAPPING_COLUMNS.md \
                  tests/lean/test_property_name_override.py
          git commit -m 'Add optional property name mapping support'
          git push origin HEAD:simplify-metadata-boundary
