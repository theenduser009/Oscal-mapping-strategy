name: Mapper checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install release test dependencies
        run: python -m pip install 'snowflake-snowpark-python[localtest]==1.55.0' pandas==2.3.3
      - name: Check generated notebook
        run: python tools/sync_notebook_cells.py --check
      - name: Test lean release and installed Snowpark APIs
        env:
          REQUIRE_SNOWPARK_TESTS: '1'
        run: python -m unittest discover -s tests/lean -v
      - name: Check whitespace
        run: git diff --check
