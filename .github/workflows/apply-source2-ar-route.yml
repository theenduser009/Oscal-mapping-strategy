name: Apply Source 2 Assessment Results route

on:
  push:
    branches: [simplify-metadata-boundary]
    paths:
      - '.github/workflows/apply-source2-ar-route.yml'

permissions:
  contents: write

jobs:
  apply-test-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: simplify-metadata-boundary
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Add Source 2 Assessment Results binding and runtime row
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          cell = Path('notebooks/cells/01_initialization_and_configuration.py')
          text = cell.read_text(encoding='utf-8')
          old = '''        "MODEL_BINDINGS": ("CATALOG",),\n        "SOURCE_ORDER_CANDIDATES": (\n'''
          new = '''        "MODEL_BINDINGS": ("CATALOG", "ASSESSMENT_RESULTS"),\n        "MODEL_STORAGE_CONTRACTS": {\n            "ASSESSMENT_RESULTS": {\n                "VERIFIED": True,\n                "PHYSICAL_PROFILE": "BINARY16_UUID32",\n                "MODEL_KEY": "ASSESSMENT_RESULTS",\n                "ROOT_PATH": "assessment-results",\n                "ROOT_ELEMENT_TYPE": "assessment-results",\n                "SOURCE_SYSTEM_NAME": "ARCHER",\n                "SOURCE_TABLE_NAME": "ARCHER_CONTENT_AUTHORITATIVE_SOURCES_SOURCE_RAW",\n                "RAW_TABLE": "RTX_RAW_DEV.ES_ESC_GRC.ARCHER_CONTENT_AUTHORITATIVE_SOURCES_SOURCE_RAW",\n                "TARGET_DIM": "RTX_ENTERPRISESERVICES_DEV.ES_ESC_GRC_CURATED.DIM_OSCAL_ASSESSMENT_RESULTS_ELEMENT",\n                "TARGET_FACT": "RTX_ENTERPRISESERVICES_DEV.ES_ESC_GRC_CURATED.FACT_OSCAL_ASSESSMENT_RESULTS_DEPENDENCY",\n                "DIM_PK_COLUMN": "PK_DIM_OSCAL_ASSESSMENT_RESULTS_ELEMENT_HASH",\n                "FACT_PK_COLUMN": "PK_FACT_OSCAL_ASSESSMENT_RESULTS_DEPENDENCY_HASH",\n                "IDENTITY_VERSION": "v1_registry_path_instance",\n            },\n        },\n        "SOURCE_ORDER_CANDIDATES": (\n'''
          if old in text:
              cell.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif '"MODEL_BINDINGS": ("CATALOG", "ASSESSMENT_RESULTS"),' not in text:
              raise SystemExit('Source 2 binding anchor not found')

          def clean_dictreader_rows(path, encoding):
              with path.open(encoding=encoding, newline='') as handle:
                  reader = csv.DictReader(handle)
                  fields = reader.fieldnames
                  rows = list(reader)
              if not fields:
                  raise SystemExit(f'{path} has no header')
              for row in rows:
                  extras = row.pop(None, None)
                  if extras and any(str(value or '').strip() for value in extras):
                      raise SystemExit(f'{path} has nonblank values beyond its header')
              return fields, rows

          runtime = Path('Mapping/sources_source_runtime.csv')
          fields, rows = clean_dictreader_rows(runtime, 'utf-8-sig')
          assert 'PROPERTY_NAME' in fields
          key = 'COUNT_OF_NONCOMPLIANT_CONTROLS'
          if not any(r['SOURCE_FIELD_NAME'] == key and r['OSCAL_MODEL'] == 'Assessment Results' for r in rows):
              row = {name: '' for name in fields}
              row.update({
                  'SOURCE_FIELD_NAME': key,
                  'OSCAL_MODEL': 'Assessment Results',
                  'OSCAL_ELEMENT_PATH': 'assessment-results.results[].props[]',
                  'MAPPING_TYPE': 'Extension Property',
                  'NOTES': 'Number of non-compliant controls at the authoritative-source result grain',
                  'EXECUTION_STATUS': 'APPROVED',
                  'TRANSFORM_ID': 'direct',
                  'RUNTIME_TARGET_PATH': 'assessment-results.results[].props[]',
                  'RULE_ID': 'assessment-results:COUNT_OF_NONCOMPLIANT_CONTROLS:property',
                  'SOURCE_KEY': 'source-two-source',
                  'ORIGINAL_ROW_ID': 'source2-source:20',
                  'SOURCE_DOCUMENT': 'Mapping/archer_authoritative_sources_oscal_mappings.xlsx',
                  'SOURCE_LINE': '20',
                  'ORIGINAL_EXCEL_ROW': '20',
                  'EXECUTION_NOTE': 'Live readiness 2026-09-17: 148/148 populated INTEGER. Existing Assessment Results registry has one results[] record per SOURCE_RECORD_ID; preserve this aggregate as named result property.',
                  'VALUE_SOURCE': 'FIELD',
                  'PROPERTY_NAME': 'noncompliant-count',
              })
              rows.append(row)
          with runtime.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, quoting=csv.QUOTE_ALL, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          disposition = Path('Mapping/sources_source_final_disposition.csv')
          dfields, drows = clean_dictreader_rows(disposition, 'utf-8')
          found = False
          for row in drows:
              if row['source_field_name'] == key:
                  found = True
                  row['final_status'] = 'RUNTIME_PROMOTED_PREVIEW_PENDING'
                  row['runtime_or_review_target'] = 'assessment-results.results[].props[]'
                  row['decision'] = ('Promoted as named result property noncompliant-count because the live Assessment Results '
                                     'registry has one results[] record per SOURCE_RECORD_ID. Live Source 2 PREVIEW/COMMIT remains pending.')
          if not found:
              raise SystemExit('Source disposition row 20 is missing')
          with disposition.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=dfields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(drows)
          PY

      - name: Static Source 2 Assessment Results route check
        run: |
          python - <<'PY'
          import ast, csv
          from pathlib import Path

          tree = ast.parse(Path('notebooks/cells/01_initialization_and_configuration.py').read_text(encoding='utf-8'))
          source_files = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'SOURCE_FILES' for t in node.targets):
                  source_files = ast.literal_eval(node.value)
          assert source_files is not None
          source = next(row for row in source_files if row['SOURCE_KEY'] == 'source-two-source')
          assert source['MODEL_BINDINGS'] == ('CATALOG', 'ASSESSMENT_RESULTS')
          storage = source['MODEL_STORAGE_CONTRACTS']['ASSESSMENT_RESULTS']
          assert storage['SOURCE_TABLE_NAME'] == 'ARCHER_CONTENT_AUTHORITATIVE_SOURCES_SOURCE_RAW'
          assert storage['RAW_TABLE'] == 'RTX_RAW_DEV.ES_ESC_GRC.ARCHER_CONTENT_AUTHORITATIVE_SOURCES_SOURCE_RAW'
          assert storage['TARGET_DIM'].endswith('DIM_OSCAL_ASSESSMENT_RESULTS_ELEMENT')
          assert storage['TARGET_FACT'].endswith('FACT_OSCAL_ASSESSMENT_RESULTS_DEPENDENCY')

          with Path('Mapping/sources_source_runtime.csv').open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          matches = [r for r in rows if r['SOURCE_FIELD_NAME'] == 'COUNT_OF_NONCOMPLIANT_CONTROLS'
                     and r['OSCAL_MODEL'] == 'Assessment Results']
          assert len(matches) == 1
          row = matches[0]
          assert row['EXECUTION_STATUS'] == 'APPROVED'
          assert row['RUNTIME_TARGET_PATH'] == 'assessment-results.results[].props[]'
          assert row['PROPERTY_NAME'] == 'noncompliant-count'
          print('SOURCE2_AR_ROUTE_STATIC_CHECK_PASSED')
          PY

      - name: Synchronize generated notebook files
        run: python tools/sync_notebook_cells.py

      - name: Verify generated notebook synchronization
        run: python tools/sync_notebook_cells.py --check

      - name: Check whitespace
        run: git diff --check

      - name: Commit Source 2 Assessment Results route
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/cells/01_initialization_and_configuration.py \
                  notebooks/cells_v2/01_initialization_and_configuration.py \
                  notebooks/NB_ARCHER_OSCAL_MAPPER_V1.py \
                  Mapping/sources_source_runtime.csv \
                  Mapping/sources_source_final_disposition.csv
          git commit -m 'Add Source 2 Assessment Results runtime route'
          git push origin HEAD:simplify-metadata-boundary
